defaults:
  - data: canonical_meta
  - model: ring_criss_cross
  - trainer: a100_ddp
  - _self_

task: pretrain
seed: 0
resume_from: null

mask:
  temporal_span: 2
  ring_arc: 3
  full_channel_probability: 0.1
  block_shape: [2, 2]
  random_patch_probability: 0.15

objective:
  latent_weight: 1.0
  kinematic_weight: 1.0
  kinematic_dim: null
  ema_decay: 0.996

optimizer:
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 100000

# Run inside the Hydra output directory so checkpoints, tensorboard logs, and
# metadata all land next to the resolved config. Paths passed from the CLI
# (data.root, manifest_path, checkpoint_path) must therefore be absolute.
hydra:
  job:
    chdir: true
