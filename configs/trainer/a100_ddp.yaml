accelerator: gpu
devices: auto
strategy: auto
precision: bf16-mixed
max_epochs: 100
accumulate_grad_batches: 1
# Rich's progress renderer cannot reliably emit Unicode to legacy GBK consoles.
enable_progress_bar: false
callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: checkpoints
    filename: "{epoch}-{step}"
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
